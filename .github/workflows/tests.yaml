name: Tests

# Runs on every push and pull request, and is the gate release.yaml calls
# before anything is published.
on:
  push:
    branches: ["**"] # not tags: a release tag runs these through release.yaml
  pull_request:
  workflow_call:

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install test requirements
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests -q

  # The package must build and its metadata must render, or a release would
  # fail at publish time instead of here.
  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
