name: Release

# A `gqlparser-<version>` tag releases that version: the tests must pass, the tag
# must match gqlparser/__version__.py, and then the wheel + sdist go to PyPI.
on:
  push:
    tags:
      - "gqlparser-*"

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # The version comes from gqlparser/__version__.py, never from the tag; a tag
      # that disagrees is a mistake, so refuse it rather than publish the wrong name.
      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#gqlparser-}"
          PACKAGE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' gqlparser/__version__.py)
          if [ -z "${PACKAGE_VERSION}" ]; then
            echo "ERROR: could not read __version__ from gqlparser/__version__.py" >&2
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match __version__ ${PACKAGE_VERSION}" >&2
            exit 1
          fi
          echo "Releasing gqlparser ${PACKAGE_VERSION}"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Archive distribution
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Verify the wheel and sdist are both staged
        run: |
          set -euo pipefail
          ls -1 dist/
          ls dist/gqlparser-*-py3-none-any.whl >/dev/null
          ls dist/gqlparser-*.tar.gz >/dev/null

      # Trusted publishing: no token. PyPI must list this repo, release.yaml and
      # the `pypi` environment as a (pending) trusted publisher for `gqlparser`.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
